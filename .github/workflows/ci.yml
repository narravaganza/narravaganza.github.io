name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-site:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo (binary)
        run: |
          set -euo pipefail
          HUGO_VERSION="0.154.5"
          ARCHIVE="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -L -o "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${ARCHIVE}"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/hugo" version

      - name: Build site
        run: |
          hugo build

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Check site
        run: |
          NOKOGIRI_USE_SYSTEM_LIBRARIES=true
          gem install html-proofer --silent
          htmlproofer --ignore-urls "/leonardo.ai/,/instagram.com/,/midjourney.com/,/twitter.com/,/reddit.com/,/substack.com/,/chatgpt.com/,/openai.com/,/claude.ai/" ./docs
