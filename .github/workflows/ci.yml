name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-site:
    name: Build
    runs-on:  macos-14

    steps:
      - uses: actions/checkout@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Build site
        run: |
          bundle install --quiet
          bundle exec jekyll build

      - name: Check site
        run: |
          NOKOGIRI_USE_SYSTEM_LIBRARIES=true
          gem install html-proofer --silent
          htmlproofer --ignore-urls "/instagram.com/,/midjourney.com/,/twitter.com/,/reddit.com/,/substack.com/,/chatgpt.com/,/openai.com/" ./_site
