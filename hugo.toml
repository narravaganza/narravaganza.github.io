baseURL = "https://narravaganza.lol/"
title = "Narravaganza"
locale = "en-us"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
publishDir = "docs"

# Keep source images separate from AVIF derivatives without breaking old URLs.
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "assets/images/originals"
  target = "static/assets/images"

[params]
  description = "Narravaganza is an online collection of humorous short stories and flash fiction."
  ogImage = "https://narravaganza.lol/assets/images/avellaneous_satellite.jpg"

[permalinks]
  stories = "/stories/:slug/"
  essays = "/essays/:slug/"
  sketches = "/sketches/:slug/"

[outputs]
  home = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
