{{- $section := .Get "section" | default "stories" -}}
{{- $pages := where .Site.RegularPages "Section" $section -}}
{{- range sort $pages "File.Path" -}}
<a href="{{ .RelPermalink }}" class="story-list-header">{{ .Title }}</a>
<div class="story-list-preview">{{ .Params.preview }}</div>
{{- end -}}
