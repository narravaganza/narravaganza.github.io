{{ define "main" }}
<h1 class="story-header">{{ .Title }}</h1>
{{ partial "translation-links.html" (dict "page" .) }}

<div class="story-body{{ with .Params.format }} story-body--{{ . | urlize }}{{ end }}">
  {{- if eq .Params.format "greentext" -}}
    {{- partial "greentext-content.html" . -}}
  {{- else -}}
    {{- partial "optimized-content.html" . -}}
  {{- end -}}
</div>
{{ end }}
