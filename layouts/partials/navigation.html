<nav>
  <a href="{{ "/" | relURL }}" class="nav-title">Narravaganza</a>
  <p class="nav-tagline">Short Stories to make you LOLWTF</p>
  {{- $current := .RelPermalink -}}
  {{- with hugo.Data.navigation -}}
    {{- range . -}}
      {{- $link := .link -}}
      {{- $isCurrent := or (eq $current $link) (eq $current (printf "%s/" $link)) -}}
      <a href="{{ $link | relURL }}" class="{{ if $isCurrent }}current-navigation-item{{ else }}navigation-item{{ end }}">{{ .name }}</a>
    {{- end -}}
  {{- end -}}
</nav>
